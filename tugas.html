<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast! - Navbar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="nav-container">

            <!-- Logo Block Blast -->
            <a href="#" class="nav-logo">
                <div class="logo-blocks">
                    <span class="block b1"></span>
                    <span class="block b2"></span>
                    <span class="block b3"></span>
                    <span class="block b4"></span>
                </div>
                <span class="logo-text">BLOCK BLAST<span class="logo-exclaim">!</span></span>
            </a>

            <!-- Hamburger Menu (Mobile) -->
            <div class="hamburger" id="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

            <!-- Navigation Links -->
            <ul class="nav-menu" id="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link active">
                        <i class="fas fa-home"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fas fa-play-circle"></i> Play
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fas fa-store"></i> Shop
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fas fa-medal"></i> Leaderboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fas fa-gift"></i> Rewards
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link btn-play">
                        <i class="fas fa-gamepad"></i> Play Now
                    </a>
                </li>
            </ul>

        </div>
    </nav>

    <!-- ===== KONTEN CONTOH ===== -->
    <section class="hero">
        <h1>🧩 Block Blast! 🧩</h1>
        <p>Let's blast the blocks and have fun!</p>
    </section>

    <script>
        // Toggle Mobile Menu
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('nav-menu');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        // Tutup menu saat link diklik (mobile)
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });
    </script>

</body>
</html>
